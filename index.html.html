<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minha Feira 360</title>
<style>
:root{--bg:#eef4ff;--card:#fff;--tx:#0b2545;--mu:#5b6b85;--pr:#1565d8;--pt:#fff;--bd:#d3e0f5;--ok:#0a8f4e;--er:#c62828;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1424;--card:#13233b;--tx:#e8f0fe;--mu:#9fb2d0;--pr:#4b8dff;--pt:#fff;--bd:#25395a;--ok:#3ddc84;--er:#ff7b7b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a1424;--card:#13233b;--tx:#e8f0fe;--mu:#9fb2d0;--pr:#4b8dff;--pt:#fff;--bd:#25395a;--ok:#3ddc84;--er:#ff7b7b;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:26px;margin:8px 0 4px}h2{font-size:20px;margin:0 0 12px}
.sub{color:var(--mu);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:14px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:18px;margin-bottom:12px;font-size:17px;font-weight:700;background:var(--pr);color:var(--pt);cursor:pointer}
.btn.sec{background:var(--card);color:var(--pr);border:2px solid var(--pr)}
.btn.ok{background:var(--ok);color:#fff}.btn.er{background:var(--er);color:#fff}
.btn.sm{display:inline-block;width:auto;padding:8px 14px;margin:0;font-size:14px}
.total{font-size:42px;font-weight:800;color:var(--pr);line-height:1.1}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.top{background:var(--pr);color:#fff;border-radius:16px;padding:16px;margin-bottom:14px}
.top .total{color:#fff}.top small{opacity:.85}
label{display:block;font-weight:600;margin:12px 0 4px}
input{width:100%;padding:14px;border:1px solid var(--bd);border-radius:12px;font-size:16px;background:var(--bg);color:var(--tx)}
.item{border-bottom:1px solid var(--bd);padding:10px 0}.item:last-child{border:0}
.mu{color:var(--mu);font-size:14px}.qty button{width:34px;height:34px;border-radius:50%;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:18px}
.modal{position:fixed;inset:0;background:rgba(5,15,35,.6);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px;max-height:92dvh;overflow:auto}
#reader{width:100%;min-height:240px;border-radius:12px;overflow:hidden;background:#000}
.back{background:none;border:0;color:var(--pr);font-weight:700;font-size:16px;padding:8px 0;cursor:pointer}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0;white-space:nowrap}.chip{border:1px solid var(--pr);background:var(--card);color:var(--pr);border-radius:20px;padding:8px 12px;font-size:14px;cursor:pointer}.chip.on{background:var(--pr);color:var(--pt)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}.g2 .card{margin:0}.g2 .total{font-size:24px}.bar{background:var(--bg);border-radius:8px;height:12px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pr)}
select{width:100%;padding:12px;border:1px solid var(--bd);border-radius:12px;font-size:16px;background:var(--bg);color:var(--tx)}
</style></head><body><div id="app"></div><div id="m"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script>
let S={supers:[],products:{},fairs:[],lists:[],budget:{},cfg:{},cats:['Alimentos','Bebidas','Carnes','Frutas','Verduras','Higiene','Limpeza','Laticínios','Outros']},view='home',vid=null,scanner=null;
try{const r=localStorage.getItem('mf360');if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem('mf360',JSON.stringify(S));return true}catch(e){return false}};
Object.values(S.products).forEach(p=>{if(p.last==null&&p.price!=null){p.last=p.price;delete p.price}});
const $=s=>document.querySelector(s);
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const R=v=>(+v||0).toLocaleString('pt-BR',S.cfg&&S.cfg.nosym?{minimumFractionDigits:2,maximumFractionDigits:2}:{style:'currency',currency:'BRL'});
const tot=f=>f.items.reduce((a,i)=>a+i.price*i.qty,0);
const cur=()=>S.fairs.find(f=>f.status==='andamento');
const last=()=>[...S.fairs].reverse().find(f=>f.status==='finalizada');
const dt=d=>d.split('-').reverse().join('/');
const now=()=>{const d=new Date(),p=n=>String(n).padStart(2,'0');return{d:d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()),t:p(d.getHours())+':'+p(d.getMinutes())}};
const go=(v,id)=>{view=v;vid=id||null;render()};
function render(){
 const a=$('#app'),c=cur(),l=last();
 if(view==='home'){
  a.innerHTML=`<h1>🛒 Minha Feira 360</h1><p class="sub">${S.cfg.name?'Olá, '+esc(S.cfg.name)+'! ':''}Controle suas compras de supermercado</p>
  ${c?`<div class="card"><div class="mu">Feira em andamento · ${esc(c.market)}</div><div class="total">${R(tot(c))}</div></div>`:''}
  <button class="btn" onclick="go('new')">INICIAR NOVA FEIRA</button>
  ${c?`<button class="btn ok" onclick="go('shop')">CONTINUAR FEIRA</button>`:''}
  <button class="btn sec" onclick="go('hist')">HISTÓRICO DE FEIRAS</button>
  <button class="btn sec" onclick="go('lists')">LISTA DE COMPRAS</button>
  <button class="btn sec" onclick="go('cmp')">COMPARAR PREÇOS</button>
  <button class="btn sec" onclick="go('rel')">RELATÓRIOS</button>
  <button class="btn sec" onclick="go('gastos')">MEUS GASTOS</button>
  <button class="btn sec" onclick="go('prods')">MEUS PRODUTOS</button>
  <button class="btn sec" onclick="go('cfg')">⚙️ CONFIGURAÇÕES</button>
  ${orcCard()}<div class="card"><h2>Última feira finalizada</h2>${l?`<div><b>${esc(l.market)}</b></div><div class="mu">${dt(l.date)} · ${l.items.length} lançamentos</div><div class="total" style="font-size:28px">${R(tot(l))}</div>`:'<div class="mu">Nenhuma feira finalizada ainda.</div>'}</div>`;
 }
 else if(view==='new'){
  const n=now();
  if(c){a.innerHTML=`<button class="back" onclick="go('home')">← Voltar</button><div class="card"><h2>Já existe uma feira em andamento</h2><p>${esc(c.market)} · ${R(tot(c))}</p><button class="btn ok" onclick="go('shop')">CONTINUAR FEIRA EXISTENTE</button></div>`;return}
  a.innerHTML=`<button class="back" onclick="go('home')">← Voltar</button><div class="card"><h2>Nova feira</h2>
  <label>Supermercado</label><input id="mk" list="sl" placeholder="Selecione ou digite um novo"><datalist id="sl">${S.supers.map(s=>`<option value="${esc(s)}">`).join('')}</datalist>
  <label>Data</label><input id="dd" type="date" value="${n.d}"><label>Hora de início</label><input id="hh" type="time" value="${n.t}">
  <label>Lista de compras</label><select id="ls"><option value="">Começar sem lista</option>${S.lists.filter(l=>l.status==='ativa'&&!l.fairId).map(l=>`<option value="${l.id}">${esc(l.name)} (${l.items.length} itens)</option>`).join('')}</select>
  <button class="btn" style="margin-top:16px" onclick="startFair()">CONFIRMAR E COMEÇAR</button></div>`;
 }
 else if(view==='shop'){
  if(!c)return go('home');
  a.innerHTML=`<div class="top"><div class="row"><b>${esc(c.market)}</b><button class="btn sm sec" onclick="go('home')">Início</button></div><small>${dt(c.date)} · início ${c.time}</small><div class="total">${R(tot(c))}</div><small>${c.items.length} lançamentos</small></div>
  <button class="btn" onclick="scan()">📷 BIPAR ${c.items.length?'PRÓXIMO ':''}PRODUTO</button>
  <button class="btn sec" onclick="fromScan=false;openItem({})">ADICIONAR MANUALMENTE</button>
  <button class="btn sec" onclick="PF.fav=true;go('prods')">⭐ PRODUTOS FAVORITOS</button>
  <button class="btn sec" onclick="go('list',c.id)">VER LISTA DA FEIRA</button>
  ${LL(c)?`<button class="btn sec" onclick="go('fl')">📋 LISTA DE COMPRAS (${LL(c).items.filter(i=>i.status==='pendente').length} pendentes)</button>`:''}
  <button class="btn ok" onclick="finish()">FINALIZAR FEIRA</button>`;
 }
 else if(view==='list'){
  const f=S.fairs.find(x=>x.id===vid);if(!f)return go('home');const ed=f.status==='andamento';
  a.innerHTML=`<button class="back" onclick="go('${ed?'shop':'hist'}')">← Voltar</button><div class="card"><h2>${esc(f.market)} · ${dt(f.date)}</h2><div class="mu">${f.time}${f.end?' – '+f.end:''} · ${f.items.length} lançamentos · ${un(f)} un.</div><div class="total">${R(tot(f))}</div>
  ${f.items.length?f.items.map(i=>`<div class="item"><div class="row"><b>${esc(i.name)}</b><b>${R(i.price*i.qty)}</b></div><div class="row"><span class="mu">${fq(i.qty)} ${i.unit||'un'} × ${Rp(i.price)}/${i.unit||'un'}${i.code?' · '+esc(i.code):''}</span>${ed?`<span class="qty"><button onclick="qty('${i.id}',-1)">−</button> ${i.qty} <button onclick="qty('${i.id}',1)">+</button> <button onclick="editItem('${i.id}')">✏️</button> <button onclick="del('${i.id}')">🗑</button></span>`:`<span></span>`}</div></div>`).join(''):'<p class="mu">Nenhum item lançado.</p>'}</div>`;
 }
 else if(view==='hist'){
  a.innerHTML=`<button class="back" onclick="go('home')">← Voltar</button><h2>Histórico de feiras</h2>${orcLine()}<input placeholder="Pesquisar supermercado" value="${esc(H.q)}" oninput="H.q=this.value;histList()">${filt(0)}<div id="hl"></div>`;histList();
 }
 else if(view==='gastos'){a.innerHTML=gastos();
 }
 else if(view==='cmp'){a.innerHTML=cmpView();cmpList();
 }
 else if(view==='prod'){a.innerHTML=prodView();
 }
 else if(view==='lists'){a.innerHTML=listsView();
 }
 else if(view==='pl'){a.innerHTML=plView();
 }
 else if(view==='fl'){a.innerHTML=flView();
 }
 else if(view==='orc'){a.innerHTML=orcView();
 }
 else if(view==='rel'){a.innerHTML=relView();
 }
 else if(view==='cfg'){a.innerHTML=cfgView();
 }
 else if(view==='prods'){
  a.innerHTML=prodsView();prodList();
 }
}
function startFair(){
 const m=$('#mk').value.trim();if(!m)return alert('Informe o supermercado.');
 if(cur())return go('shop');
 if(!S.supers.includes(m))S.supers.push(m);
 const fid='f'+Date.now(),lid=$('#ls').value||null;S.fairs.push({id:fid,market:m,date:$('#dd').value,time:$('#hh').value,status:'andamento',items:[],listId:lid});const L0=S.lists.find(x=>x.id===lid);if(L0)L0.fairId=fid;
 save();go('shop');
}
function finish(){if(!cur().items.length&&!confirm('Nenhum item lançado. Finalizar mesmo assim?'))return;
 if(LL(cur()))return sumModal();if(!confirm('Finalizar esta feira? Total: '+R(tot(cur()))))return;
 const f=cur();f.status='finalizada';f.end=now().t;save();go('home')}
function qty(id,d){const f=cur(),i=f.items.find(x=>x.id===id);const n=+(i.qty+d*(['g','ml'].includes(i.unit)?100:1)).toFixed(3);if(n>0)i.qty=n;save();render()}
function del(id){const f=cur();f.items=f.items.filter(x=>x.id!==id);S.lists.forEach(L=>L.items.forEach(i=>{if(i.lid===id){i.status='pendente';i.lid=null}}));save();render()}
function delProd(i){const k=PK[i];if(!confirm('Excluir este produto do cadastro? O histórico de compras é mantido.'))return;delete S.products[k];save();render()}
let busy=false,sending=false,fromScan=false,curId='',curEdit='';
function close(){$('#m').innerHTML='';busy=false;sending=false}
async function stopScan(){if(scanner){try{await scanner.stop()}catch(e){}try{scanner.clear()}catch(e){}scanner=null}}
async function closeScan(){await stopScan();close();render()}
const num=s=>{s=String(s).trim();if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');return s===''?NaN:Number(s)};
function scan(){
 busy=false;fromScan=true;const c=cur();
 $('#m').innerHTML=`<div class="modal"><div class="sheet"><div class="row"><b>${esc(c.market)}</b><b>${c.items.length} itens · ${R(tot(c))}</b></div><h2 style="margin-top:10px">Aponte para o código de barras</h2><div id="reader"></div><p id="se" class="mu">Centralize o código na área de leitura.</p><button class="btn sec" onclick="closeScan()">✕ FECHAR LEITOR</button></div></div>`;
 try{
  const H=window.Html5Qrcode,F=window.Html5QrcodeSupportedFormats;
  scanner=new H('reader',{formatsToSupport:[F.EAN_13,F.EAN_8,F.UPC_A,F.UPC_E],verbose:false});
  scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:260,height:160}},t=>found(String(t)),()=>{}).catch(()=>{$('#se').textContent='Câmera indisponível ou sem permissão. Libere o acesso à câmera no navegador e tente de novo.'});
 }catch(e){$('#se').textContent='Leitor indisponível neste navegador.'}
}
async function found(code){
 if(busy||!code)return;busy=true;await stopScan();
 const p=S.products[code];openItem(p?{...p,known:true}:{code});
}
function editItem(id){const i=cur().items.find(x=>x.id===id);fromScan=false;openItem({code:i.code,name:i.name,price:i.price,qty:i.qty,unit:i.unit,known:!!i.code},id)}
function sub(){const pv=num($('#ip').value),tv=LE==='t'?num($('#it').value):NaN;$('#sb').textContent=R(isFinite(tv)?tv:(pv||0)*(num($('#iq').value)||0));
 const w=$('#pw'),pr=curEdit?null:S.products[$('#ic').value.trim()];
 if(w)w.textContent=(pr&&pr.last!=null&&pv>0&&Math.abs(pv-pr.last)>0.004&&(!pr.unit||pr.unit===$('#iu').value))?`Preço anterior ${R(pr.last)} → atual ${R(pv)} (${sg(pv-pr.last)}${pct(pv,pr.last)?' · '+pct(pv,pr.last):''})`:''}
function cancelItem(){const s=fromScan&&!curEdit;close();if(s)scan();else render()}
function openItem(p,eid){
 LE='p';curEdit=eid||'';curId='i'+Date.now()+Math.random().toString(36).slice(2,6);sending=false;
 const nw=!p.known&&p.code&&!eid,lab=eid?'SALVAR ALTERAÇÕES':nw?'SALVAR E ADICIONAR À FEIRA':'ADICIONAR À FEIRA';
 $('#m').innerHTML=`<div class="modal"><div class="sheet"><h2>${eid?'Editar lançamento':p.known?'Lançar produto':nw?'Produto novo':'Adicionar manualmente'}</h2>
 <label>Código</label><input id="ic" value="${esc(p.code||'')}" ${p.code?'readonly':''} placeholder="Opcional" inputmode="numeric">
 <label>Nome do produto</label><input id="in" value="${esc(p.name||'')}" ${p.known?'readonly':''}>
 ${nw||(!p.known&&!eid)?'<label>Marca (opcional)</label><input id="ib">'+catSel():''}
 <label>Preço unitário pago (R$)</label><input id="ip" inputmode="decimal" value="${eid?String(p.price).replace('.',','):''}" placeholder="0,00" oninput="ed('p')" onfocus="this.scrollIntoView({block:'center'})">
 ${p.last!=null&&!eid?`<div class="mu">Referência: último preço pago ${R(p.last)}</div>`:''}
 <label>Preço por</label><select id="iu" onchange="sub()">${UN.map(u=>`<option ${(p.unit||'un')===u?'selected':''}>${u}</option>`).join('')}</select>
 <label>Quantidade</label><input id="iq" inputmode="decimal" value="${eid?String(p.qty).replace('.',','):'1'}" oninput="ed()">
 <label>Total do item (R$) — opcional</label><input id="it" inputmode="decimal" placeholder="Ou informe o total pago" oninput="ed('t')">
 <div id="pw" class="mu" style="margin-top:8px"></div><div class="mu" style="margin-top:10px">Subtotal</div><div class="total" id="sb" style="font-size:30px">R$ 0,00</div>
 <button class="btn ok" id="ok" style="margin-top:14px" onclick="addItem()">${lab}</button><button class="btn sec" onclick="cancelItem()">CANCELAR</button></div></div>`;
 ed('p');setTimeout(()=>{const e=$('#ip');if(e)e.focus()},80);
}
function addItem(){
 if(sending)return;
 const code=$('#ic').value.trim(),name=$('#in').value.trim(),b=$('#ib'),brand=b?b.value.trim():'',q=num($('#iq').value),unit=$('#iu').value,tt=LE==='t'?num($('#it').value):NaN,price=isFinite(tt)&&q>0?tt/q:num($('#ip').value);
 if(!name)return alert('Informe o nome do produto.');
 if(!isFinite(price)||price<=0)return alert('Informe um preço válido.');
 if(!isFinite(q)||q<=0)return alert('Quantidade inválida.');
 sending=true;$('#ok').disabled=true;
 const snap=JSON.stringify(S),f=cur();
 if(curEdit){const i=f.items.find(x=>x.id===curEdit);i.price=price;i.qty=q;i.unit=unit}
 else if(!f.items.some(x=>x.id===curId))f.items.push({id:curId,code,name,price,qty:q,unit});
 if(code){const ex=S.products[code];if(ex){ex.last=price;ex.unit=unit}else S.products[code]={code,name,brand,cat:$('#icat')?$('#icat').value:'',last:price,unit}}
 if(!curEdit&&f.listId)autoLink(f,{id:curId,code,name});
 if(!save()){S=JSON.parse(snap);sending=false;$('#ok').disabled=false;return alert('Lançamento NÃO confirmado: falha ao salvar. Tente novamente.')}
 const again=fromScan&&!curEdit;close();render();if(again)scan();
}
const H={q:'',from:'',to:'',k:'all'},G={from:'',to:'',k:'all',sort:'gasto',mode:'mes'},d0=new Date();
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const C={a:iso(d0).slice(0,7),b:iso(new Date(d0.getFullYear(),d0.getMonth()-1,1)).slice(0,7)};
const un=f=>String(+f.items.reduce((a,i)=>a+i.qty,0).toFixed(3)).replace('.',',');
const inP=(f,p)=>(!p.from||f.date>=p.from)&&(!p.to||f.date<=p.to);
const sum=l=>l.reduce((a,f)=>a+tot(f),0);
const sg=d=>(d>0?'+':d<0?'−':'')+R(Math.abs(d));
function qr(k){const y=d0.getFullYear(),m=d0.getMonth();
 if(k==='mes')return[iso(new Date(y,m,1)),iso(new Date(y,m+1,0))];
 if(k==='ant')return[iso(new Date(y,m-1,1)),iso(new Date(y,m,0))];
 if(k==='3m')return[iso(new Date(y,m-2,1)),iso(new Date(y,m+1,0))];
 if(k==='ano')return[y+'-01-01',y+'-12-31'];
 return['',''];}
function setQ(w,k){const P=[H,G,R4][w];P.k=k;[P.from,P.to]=qr(k);render()}
function setD(w,f,v){const P=[H,G,R4][w];P[f]=v;P.k='';render()}
function filt(w){const P=[H,G,R4][w],ks=[['mes','Este mês'],['ant','Mês anterior'],['3m','Últimos 3 meses'],['ano','Este ano'],['all','Todo o histórico']];
 return `<div class="chips">${ks.map(([k,l])=>`<button class="chip ${P.k===k?'on':''}" onclick="setQ(${w},'${k}')">${l}</button>`).join('')}</div><div class="row" style="gap:8px;margin-bottom:12px"><input type="date" value="${P.from}" onchange="setD(${w},'from',this.value)"><input type="date" value="${P.to}" onchange="setD(${w},'to',this.value)"></div>`}
function histList(){const q=H.q.trim().toLowerCase();
 const l=S.fairs.filter(f=>inP(f,H)&&f.market.toLowerCase().includes(q)).sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));
 $('#hl').innerHTML=l.map(f=>`<div class="card" onclick="go('list','${f.id}')"><div class="row"><b>${esc(f.market)}</b><b>${R(tot(f))}</b></div><div class="mu">${dt(f.date)} · ${f.time}${f.end?' – '+f.end:''}${f.status==='andamento'?' · em andamento':''}</div><div class="mu">${f.items.length} lançamentos · ${un(f)} un.</div></div>`).join('')||'<p class="mu">Nenhuma feira encontrada.</p>'}
function gastos(){
 const fs=S.fairs.filter(f=>f.status==='finalizada'&&inP(f,G)),n=fs.length,T=sum(fs),mx=fs.reduce((a,f)=>Math.max(a,tot(f)),0);
 const lf=[...fs].sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time))[0];
 const M={};fs.forEach(f=>{const m=M[f.market]||(M[f.market]={n:f.market,c:0,t:0,d:''});m.c++;m.t+=tot(f);if(f.date>m.d)m.d=f.date});
 const so={gasto:(a,b)=>b.t-a.t,menor:(a,b)=>a.t-b.t,media:(a,b)=>b.t/b.c-a.t/a.c,recente:(a,b)=>b.d.localeCompare(a.d),nome:(a,b)=>a.n.localeCompare(b.n)};
 const L=Object.values(M).sort(so[G.sort]);
 const D=G.mode==='mes'?Object.entries(fs.reduce((o,f)=>{const k=f.date.slice(0,7);o[k]=(o[k]||0)+tot(f);return o},{})).sort().map(([k,v])=>[k.slice(5)+'/'+k.slice(0,4),v]):[...L].sort(so.gasto).map(m=>[m.n,m.t]);
 const mv=Math.max(...D.map(x=>x[1]),1);

const cn=v=>String(Math.round(v*1e6)/1e6).replace('.',',');
const bc=c=>/^\d+$/.test(c||'')?{t:c}:(c||'');
const cv=x=>typeof x==='number'?cn(x):(x&&typeof x==='object')?'"=""'+x.t+'"""':cs(x);
const csv=(h,r)=>'\ufeff'+[h,...r].map(a=>a.map(cv).join(';')).join('\r\n');
async function exp(k){const m=$('#xm'),F=S.fairs,fin=F.filter(f=>f.status==='finalizada'),sit=f=>f.status==='finalizada'?'Finalizada':'Em andamento';let n,h,r=[];
 if(k==='compras'){n='historico-de-compras';h=['ID','Supermercado','Data','Hora início','Hora fim','Situação','Lançamentos','Total (R$)'];r=F.map(f=>[f.id,f.market,dt(f.date),f.time,f.end||'',sit(f),f.items.length,tot(f)])}
 else if(k==='itens'){n='itens-comprados';h=['ID da feira','Supermercado','Data','Situação da feira','Código de barras','Produto','Quantidade','Unidade','Preço unitário (R$)','Subtotal (R$)'];F.forEach(f=>f.items.forEach(i=>r.push([f.id,f.market,dt(f.date),sit(f),bc(i.code),i.name,i.qty,i.unit||'un',i.price,i.price*i.qty])))}
 else if(k==='produtos'){n='produtos';h=['Código de barras','Nome','Categoria','Marca','Unidade','Favorito','Último preço pago (R$)'];r=Object.values(S.products).map(p=>[bc(p.code),p.name,p.cat||'',p.brand||'',p.unit||'un',p.fav?'Sim':'Não',p.last==null?'':p.last])}
 else if(k==='mercados'){n='supermercados';h=['Supermercado','Feiras finalizadas','Total gasto (R$)','Última compra'];r=S.supers.map(s=>{const l=fin.filter(f=>f.market===s);return[s,l.length,sum(l),l.length?dt(l.map(f=>f.date).sort().pop()):'']})}
 else{n='historico-de-precos';h=['Data','Supermercado','Código de barras','Produto','Quantidade','Unidade','Preço unitário (R$)','Unidade base','Preço por unidade base (R$)'];[...fin].sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time)).forEach(f=>f.items.forEach(i=>{const u=i.unit||'un',[ub,fc]=NU[u]||[u,1];r.push([dt(f.date),f.market,bc(i.code),i.name,i.qty,u,i.price,ub,i.price*fc])}))}
 if(!r.length){m.textContent='Sem registros para exportar.';return}
 const dl=window.claude&&claude.use?await claude.use('downloads'):null;
 if(!dl){m.textContent='A exportação não está disponível neste ambiente.';return}
 try{await dl.save({filename:n+'-'+iso(new Date())+'.csv',data:csv(h,r)});m.textContent='Arquivo gerado: '+n+'.csv'}catch(e){m.textContent=e&&e.code==='declined'?'Download cancelado.':'Não foi possível salvar o arquivo neste ambiente.'}}
applyTheme();
render();
</script></body></html>
